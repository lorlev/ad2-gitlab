schemaVersion: '2.2'

description: Run ad2-gitlab deployment framework

parameters:
  AutoDeployDir:
    type: String
    description: Absolute path to auto.deploy directory
    interpolationType: ENV_VAR
    allowedPattern: '^/datastore/web/[A-Za-z0-9._-]+/auto\.deploy$'

  CommitSha:
    type: String
    description: Full Git commit SHA to deploy
    interpolationType: ENV_VAR
    allowedPattern: '^[0-9a-f]{40}$'

mainSteps:
  - action: aws:runShellScript
    name: AutoDeploy
    precondition:
      StringEquals:
        - platformType
        - Linux
    inputs:
      timeoutSeconds: '900'
      runCommand:
        - |
          set -eu

          echo "===== AUTO DEPLOY ====="
          echo "Directory: $SSM_AutoDeployDir"
          echo "Commit:    $SSM_CommitSha"

          if [ ! -x "$SSM_AutoDeployDir/deploy.sh" ]; then
              echo "ERROR: deploy.sh not found or not executable"
              exit 1
          fi

          exec /bin/bash \
              "$SSM_AutoDeployDir/deploy.sh" \
              "$SSM_CommitSha"
